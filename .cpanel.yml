---
deployment:
  tasks:
    - export DEPLOYPATH=/home/rrcltdbn/public_html
    - /bin/mkdir -p /home/rrcltdbn/public_html/assets /home/rrcltdbn/public_html/nri-landlord-tenant-eviction
    - /bin/cp *.html /home/rrcltdbn/public_html/
    - /bin/cp *.css /home/rrcltdbn/public_html/
    - /bin/cp script.js script2.js /home/rrcltdbn/public_html/
    - /bin/cp sitemap.xml robots.txt site.webmanifest asset-version.txt llms.txt favicon.ico /home/rrcltdbn/public_html/
    - /bin/cp -R assets/* /home/rrcltdbn/public_html/assets/
    - /bin/cp -R nri-landlord-tenant-eviction/* /home/rrcltdbn/public_html/nri-landlord-tenant-eviction/
    - /bin/cp .htaccess /home/rrcltdbn/public_html/
    - /bin/chmod 755 /home/rrcltdbn/public_html
    - /bin/chmod 755 /home/rrcltdbn/public_html/assets /home/rrcltdbn/public_html/nri-landlord-tenant-eviction
    - /bin/find /home/rrcltdbn/public_html/assets -type d -exec /bin/chmod 755 {} +
    - /bin/find /home/rrcltdbn/public_html/assets -type f -exec /bin/chmod 644 {} +
    - /bin/chmod 644 /home/rrcltdbn/public_html/*.html /home/rrcltdbn/public_html/*.css /home/rrcltdbn/public_html/*.js /home/rrcltdbn/public_html/.htaccess
